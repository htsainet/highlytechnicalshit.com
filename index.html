<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>highlytechnicalshit.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem;
      gap: 0;
    }

    /* ── Title ── */
    .intro-line {
      font-size: clamp(1.2rem, 3.5vw, 1.7rem);
      color: #6e7681;
      text-align: center;
      letter-spacing: 0.02em;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      text-align: center;
    }
    h1 span { color: #58a6ff; }

    /* ── Blinking cursor ── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: #58a6ff;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── LOTR verse labels ── */
    .verse-label {
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #8b949e;
      text-align: center;
      letter-spacing: -0.01em;
      max-width: 860px;
      width: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
      margin-top: 1.6rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .verse-label.show { opacity: 1; }
    .verse-label.dim { color: #6e7681; font-style: italic; }
    .verse-label a { color: inherit; text-decoration: none; display: block; margin-top: 0.3rem; font-size: 0.8em; }
    .verse-label a:hover { text-decoration: underline; }

    /* ── Fate link ── */
    .fate-link {
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.4rem;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .fate-link.show { opacity: 1; transform: translateY(0); }
    .fate-link a { color: #58a6ff; text-decoration: none; }
    .fate-link a:hover { text-decoration: underline; }
    .fate-link a.bad { color: #f85149; }

    /* ── Install boxes ── */
    .install-box {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      max-width: 860px;
      width: 100%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      overflow: hidden;
    }
    .install-box.show { opacity: 1; transform: translateY(0); }
    .install-box code {
      flex: 1;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: clamp(0.7rem, 1.8vw, 0.88rem);
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #30363d transparent;
      min-height: 1.2em;
      padding-bottom: 2px;
    }
    .install-box code::-webkit-scrollbar { height: 4px; }
    .install-box code::-webkit-scrollbar-track { background: transparent; }
    .install-box code::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    .install-box.gold  code { color: #d4a84b; }
    .install-box.green code { color: #3fb950; }
    .install-box.claw  code { color: #e6edf3; }

    .box-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .copy-btn {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #30363d; color: #e6edf3; }
    .copy-btn.copied { color: #3fb950; border-color: #3fb950; }

    p.hint {
      font-size: 0.72rem;
      color: #484f58;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    p.hint.show { opacity: 1; }
    p.hint a { color: #484f58; text-decoration: underline; }
    p.hint a:hover { color: #8b949e; }
    .verdict-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.5rem;
      max-width: 860px;
      width: 100%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .verdict-box.show { opacity: 1; transform: translateY(0); }

    /* ── Fish track ── */
    .fish-track {
      position: relative;
      width: min(640px, 100%);
      height: 2.8rem;
    }
    .fish-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      padding: 0.3rem 0.6rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .fish-btn.block { left: 0;  color: #f85149; }
    .fish-btn.allow { right: 0; color: #3fb950; }
    .fish-btn:hover { background: rgba(255,255,255,0.05); border-color: currentColor; }
    .fish-btn:disabled { cursor: default; opacity: 0.4; }

    .fish-emoji {
      position: absolute;
      top: 50%;
      font-size: 1.5rem;
      line-height: 1;
      animation: fish-swim 4.2s ease-in-out infinite;
    }
    .fish-emoji.frozen { animation: none; }

    @keyframes fish-swim {
      0%   { left: 20%; transform: translateY(-50%) scaleX(-1); }
      42%  { left: 66%; transform: translateY(-50%) scaleX(-1); }
      52%  { left: 66%; transform: translateY(-50%) scaleX(1);  }
      94%  { left: 20%; transform: translateY(-50%) scaleX(1);  }
      100% { left: 20%; transform: translateY(-50%) scaleX(-1); }
    }

    /* ── Reprise ── */
    .reprise {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      margin-top: 2rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reprise.show { opacity: 1; transform: translateY(0); }
    .reprise h2 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .reprise h2 span { color: #58a6ff; }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 1.25rem;
      color: #484f58;
      font-size: 0.8rem;
    }
    footer a { color: #484f58; text-decoration: none; }
    footer a:hover { color: #8b949e; }
  </style>
</head>
<body>

  <!-- Line 1 label — fades in above curl box -->
  <p class="verse-label" id="label1">one command to get it all,</p>

  <!-- Box 1: curl — visible from page load, cursor blinks in empty code -->
  <div class="install-box gold show" id="box1">
    <div class="box-row">
      <code id="curlCmd"><span class="cursor" id="cursor"></span></code>
      <button class="copy-btn" id="copyBtn1" onclick="copyEl('curlCmd','copyBtn1')">Copy</button>
    </div>
    <p class="hint" id="hint">Always <a href="https://raw.githubusercontent.com/htsainet/highlytechnicalshit.com/main/install.sh"
        target="_blank" rel="noopener">inspect the script</a> before running it.</p>
  </div>

  <!-- Line 2 label — fades in above install box -->
  <p class="verse-label" id="label2">one command to build it.</p>

  <!-- Box 2: ./install.sh — hidden initially, cursor moves here before reveal -->
  <div class="install-box green" id="box2">
    <div class="box-row">
      <code id="installCmd"></code>
      <button class="copy-btn" id="copyBtn2" onclick="copyEl('installCmd','copyBtn2')">Copy</button>
    </div>
  </div>

  <!-- Line 3 — fades in after boxes -->
  <p class="verse-label dim" id="line3">when claws the law and its the wild, wild, west</p>

  <!-- Box 3: openclaw agents add -->
  <div class="install-box claw" id="box3">
    <div class="box-row">
      <code id="clawCmd"></code>
      <button class="copy-btn" id="copyBtn3" onclick="copyEl('clawCmd','copyBtn3')">Copy</button>
    </div>
  </div>

  <!-- Verdict label — fades in above verdict box -->
  <p class="verse-label dim" id="fishLabel">you must choose how to wield it.</p>

  <!-- Verdict box -->
  <div class="verdict-box" id="fishSection">
    <div class="fish-track">
      <button class="fish-btn block" id="btnBlock" onclick="chooseFate('block')">🚫 default deny</button>
      <span class="fish-emoji" id="fishEmoji">🐟</span>
      <button class="fish-btn allow" id="btnAllow" onclick="chooseFate('allow')">✅ default allow</button>
    </div>
  </div>

  <!-- Reprise — shown only on default deny -->
  <div class="reprise" id="reprise">
    <p class="intro-line">Be prepared to see some</p>
    <h2>Highly <span>Technical</span> Shit</h2>
  </div>

  <!-- Box 4: nemoclaw my-assistant connect (deny path) -->
  <div class="install-box claw" id="box4">
    <div class="box-row">
      <code id="nemoCmd"></code>
      <button class="copy-btn" id="copyBtn4" onclick="copyEl('nemoCmd','copyBtn4')">Copy</button>
    </div>
  </div>

  <!-- Box allow: rm -rf / (allow path) -->
  <div class="install-box" id="boxAllow" style="border-color:#f85149">
    <div class="box-row">
      <code id="rmCmd" style="color:#f85149"></code>
    </div>
  </div>

  <!-- Fate link (download / redirect) -->
  <div class="fate-link" id="fateLink"></div>

  <script>
    var CURL_CMD = 'curl -sSL https://raw.githubusercontent.com/htsainet/highlytechnicalshit.com/main/install.sh | bash';

    function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    // type text into el char by char; moves cursor into el as last child first
    async function type(el, text, speed) {
      speed = speed || 38;
      var chars = [...text];
      var cursor = document.getElementById('cursor');
      el.appendChild(cursor);
      for (var i = 0; i < chars.length; i++) {
        el.insertBefore(document.createTextNode(chars[i]), cursor);
        await sleep(speed + (Math.random() * 18 | 0));
      }
    }

    function show(id) { document.getElementById(id).classList.add('show'); }

    async function run() {
      // cursor blinks in empty box1 — brief pause
      await sleep(1500);

      // line 1 label fades in above box1
      show('label1');
      await sleep(500);

      // cursor types curl command into box1
      await type(document.getElementById('curlCmd'), CURL_CMD);
      show('hint');
      await sleep(500);

      // move cursor into box2 BEFORE fading it in — blinks in empty code shell
      document.getElementById('installCmd').appendChild(document.getElementById('cursor'));
      show('label2');
      await sleep(200);
      show('box2');
      await sleep(400);

      // cursor types ./install.sh into box2
      await type(document.getElementById('installCmd'), './install.sh');
      await sleep(600);

      // line 3 fades in, then box3 types
      show('line3');
      await sleep(400);
      document.getElementById('clawCmd').appendChild(document.getElementById('cursor'));
      show('box3');
      await sleep(300);
      await type(document.getElementById('clawCmd'), 'openclaw agents add', 55);
      await sleep(600);

      // verdict label then box
      show('fishLabel');
      await sleep(350);
      show('fishSection');
      await sleep(500);

      // cursor done
      document.getElementById('cursor').remove();
    }

    function chooseFate(choice) {
      document.getElementById('fishEmoji').classList.add('frozen');
      document.getElementById('btnBlock').disabled = true;
      document.getElementById('btnAllow').disabled = true;

      var label = document.getElementById('fishLabel');
      var link  = document.getElementById('fateLink');

      if (choice === 'block') {
        label.textContent = '🐟 with nemo there to shield it.';
        setTimeout(function() {
          document.getElementById('reprise').classList.add('show');
        }, 400);
        setTimeout(async function() {
          var box4 = document.getElementById('box4');
          var nemoCmd = document.getElementById('nemoCmd');
          box4.classList.add('show');
          await sleep(300);
          await type(nemoCmd, 'nemoclaw my-assistant connect', 45);
          await sleep(600);
          link.innerHTML = '<a href="dist/highlytechnicalshit.com-v0.2.0.zip" download>⬇ download the stack</a>';
          link.classList.add('show');
        }, 1200);
      } else {
        label.textContent = '🤦 one does not simply ship it.';
        setTimeout(async function() {
          var boxAllow = document.getElementById('boxAllow');
          boxAllow.classList.add('show');
          await sleep(300);
          await type(document.getElementById('rmCmd'), 'rm -rf /', 80);
          await sleep(600);
          link.innerHTML = '<a class="bad" href="https://www.uspsoperationsanta.com/" target="_blank" rel="noopener">🤦 no download for you →</a>';
          link.classList.add('show');
        }, 600);
        setTimeout(function() {
          window.location.href = 'https://www.uspsoperationsanta.com/';
        }, 4200);
      }
    }

    // copy text nodes only — excludes cursor span
    function copyEl(srcId, btnId) {
      var code = document.getElementById(srcId);
      var text = '';
      code.childNodes.forEach(function(n) {
        if (n.nodeType === Node.TEXT_NODE) text += n.textContent;
      });
      var btn = document.getElementById(btnId);
      navigator.clipboard.writeText(text.trim()).then(function() {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      }).catch(function() {
        btn.textContent = 'Failed';
        setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
      });
    }

    run();
  </script>
</body>
</html>

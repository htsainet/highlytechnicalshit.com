<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>highlytechnicalshit.com</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    h1 span {
      color: #58a6ff;
    }

    p.tagline {
      color: #8b949e;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .install-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      max-width: 680px;
      width: 100%;
    }

    .install-box code {
      flex: 1;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      color: #79c0ff;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .install-box code::-webkit-scrollbar {
      display: none;
    }

    .copy-btn {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #30363d;
      color: #e6edf3;
    }

    .copy-btn.copied {
      color: #3fb950;
      border-color: #3fb950;
    }

    footer {
      position: fixed;
      bottom: 1.25rem;
      color: #484f58;
      font-size: 0.8rem;
    }

    footer a {
      color: #484f58;
      text-decoration: none;
    }

    footer a:hover {
      color: #8b949e;
    }

    p.hint {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #484f58;
      text-align: center;
    }

    p.hint a {
      color: #484f58;
      text-decoration: underline;
    }

    p.hint a:hover {
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h1>highly<span>technical</span>shit</h1>
  <p class="tagline">one command to get it all</p>

  <div class="install-box">
    <code id="cmd">curl -sSL https://raw.githubusercontent.com/htsainet/highlytechnicalshit.com/main/install.sh | bash</code>
    <button class="copy-btn" id="copyBtn" onclick="copyCmd()">Copy</button>
  </div>
  <p class="hint">
    Always <a href="https://raw.githubusercontent.com/htsainet/highlytechnicalshit.com/main/install.sh" target="_blank" rel="noopener">inspect the script</a> before running it.
  </p>

  <footer>
    <a href="https://github.com/htsainet/highlytechnicalshit.com" target="_blank" rel="noopener">
      source on GitHub
    </a>
  </footer>

  <script>
    function copyCmd() {
      const cmd = document.getElementById('cmd').textContent.trim();
      const btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(cmd).then(function () {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function () {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      }).catch(function () {
        btn.textContent = 'Failed';
        setTimeout(function () {
          btn.textContent = 'Copy';
        }, 2000);
      });
    }
  </script>
</body>
</html>

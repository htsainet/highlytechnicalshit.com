<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>highlytechnicalshit.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem;
      gap: 0;
    }

    /* ── Title ── */
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    h1 span { color: #58a6ff; }

    /* ── Blinking cursor ── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: #58a6ff;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Verse ── */
    .verse {
      text-align: center;
      font-size: 0.92rem;
      line-height: 2.2;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
      min-height: 8rem; /* reserve space; prevents layout jump */
    }
    .verse-line { display: block; color: #6e7681; min-height: 1.5em; }
    .verse-line.dim { color: #484f58; }

    /* ── Install boxes ── */
    .install-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      max-width: 680px;
      width: 100%;
      margin-top: 0.5rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .install-box.show { opacity: 1; transform: translateY(0); }
    .install-box code {
      flex: 1;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: clamp(0.72rem, 2.5vw, 0.88rem);
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .install-box code::-webkit-scrollbar { display: none; }
    .install-box.gold code  { color: #d4a84b; }   /* curl — gold  */
    .install-box.green code { color: #3fb950; }   /* ./install.sh — green */

    .copy-btn {
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #30363d; color: #e6edf3; }
    .copy-btn.copied { color: #3fb950; border-color: #3fb950; }

    p.hint {
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: #484f58;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    p.hint.show { opacity: 1; }
    p.hint a { color: #484f58; text-decoration: underline; }
    p.hint a:hover { color: #8b949e; }

    /* ── Fish track ── */
    .fish-track {
      position: relative;
      width: min(460px, 90vw);
      height: 2.6rem;
      margin: 1rem 0 0.5rem;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .fish-track.show { opacity: 1; }
    .fish-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      user-select: none;
      white-space: nowrap;
    }
    .fish-label.block { left: 0;   color: #f85149; }
    .fish-label.allow { right: 0;  color: #3fb950; }
    .fish-emoji {
      position: absolute;
      top: 50%;
      font-size: 1.5rem;
      line-height: 1;
      /* fish emoji faces left by default; scaleX(-1) flips it right */
      animation: fish-swim 4.2s ease-in-out infinite;
    }
    @keyframes fish-swim {
      0%   { left: 16%; transform: translateY(-50%) scaleX(-1); } /* at BLOCK, facing ALLOW */
      42%  { left: 71%; transform: translateY(-50%) scaleX(-1); } /* arrive at ALLOW        */
      52%  { left: 71%; transform: translateY(-50%) scaleX(1);  } /* flip, face BLOCK        */
      94%  { left: 16%; transform: translateY(-50%) scaleX(1);  } /* arrive at BLOCK         */
      100% { left: 16%; transform: translateY(-50%) scaleX(-1); } /* flip, face ALLOW        */
    }

    /* ── Final links ── */
    .final-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .final-links.show { opacity: 1; transform: translateY(0); }
    .final-link {
      color: #484f58;
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.01em;
      transition: color 0.2s;
    }
    .final-link:hover { color: #8b949e; }
    .final-link em { font-style: normal; color: #6e7681; }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 1.25rem;
      color: #484f58;
      font-size: 0.8rem;
    }
    footer a { color: #484f58; text-decoration: none; }
    footer a:hover { color: #8b949e; }
  </style>
</head>
<body>

  <h1>highly<span>technical</span>shit<span class="cursor" id="cursor"></span></h1>

  <!-- Verse — lines filled by JS typewriter -->
  <div class="verse">
    <span class="verse-line"     id="line1"></span>
    <span class="verse-line"     id="line2"></span>
    <span class="verse-line dim" id="line3"></span>
  </div>

  <!-- Box 1: curl command (gold, hidden initially) -->
  <div class="install-box gold" id="box1">
    <code id="curlCmd">curl -sSL https://raw.githubusercontent.com/htsainet/highlytechnicalshit.com/main/install.sh | bash</code>
    <button class="copy-btn" id="copyBtn1" onclick="copyEl('curlCmd','copyBtn1')">Copy</button>
  </div>

  <!-- Box 2: ./install.sh (green, hidden initially) -->
  <div class="install-box green" id="box2">
    <code id="installCmd">./install.sh</code>
    <button class="copy-btn" id="copyBtn2" onclick="copyEl('installCmd','copyBtn2')">Copy</button>
  </div>

  <p class="hint" id="hint">
    Always <a href="https://raw.githubusercontent.com/htsainet/highlytechnicalshit.com/main/install.sh"
      target="_blank" rel="noopener">inspect the script</a> before running it.
  </p>

  <!-- Fish track -->
  <div class="fish-track" id="fishTrack">
    <span class="fish-label block">🚫 BLOCK</span>
    <span class="fish-emoji">🐟</span>
    <span class="fish-label allow">✅ ALLOW</span>
  </div>

  <!-- Final two links -->
  <div class="final-links" id="finalLinks">
    <a class="final-link" href="dist/highlytechnicalshit.com-v0.2.0.zip" download>
      <em>and nemo there to wield it.</em> 🐟 ↓
    </a>
    <a class="final-link" href="https://www.uspsoperationsanta.com/" target="_blank" rel="noopener">
      one does not simply ship it. 📦
    </a>
  </div>

  <footer>
    <a href="https://github.com/htsainet/highlytechnicalshit.com" target="_blank" rel="noopener">
      source on GitHub
    </a>
  </footer>

  <script>
    const CURL_CMD = document.getElementById('curlCmd').textContent.trim();

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function type(el, text, speed) {
      speed = speed || 38;
      // split respecting emoji / multi-codepoint chars
      var chars = [...text];
      var cursor = document.getElementById('cursor');
      // move cursor to this line
      el.appendChild(cursor);
      for (var i = 0; i < chars.length; i++) {
        el.insertBefore(document.createTextNode(chars[i]), cursor);
        await sleep(speed + (Math.random() * 18 | 0)); // slight jitter
      }
    }

    function show(id) {
      document.getElementById(id).classList.add('show');
    }

    async function run() {
      // --- 1.5s blinking pause before anything types ---
      await sleep(1500);

      // --- Line 1: "one command to get it all," ---
      await type(document.getElementById('line1'), 'one command to get it all,');
      await sleep(350);
      show('box1');
      show('hint');
      await sleep(600);

      // --- Line 2: "one command to build it." ---
      await type(document.getElementById('line2'), 'one command to build it.');
      await sleep(350);
      show('box2');
      await sleep(600);

      // --- Line 3: claws the law --- (dim style, emojis)
      await type(document.getElementById('line3'), '🦞 claws the law ⚖️ for every task 📋', 55);
      await sleep(400);
      show('fishTrack');
      await sleep(800);

      // --- cursor parks itself back on h1 ---
      document.getElementById('cursor').remove();

      // --- Final links fade in ---
      await sleep(1200);
      show('finalLinks');
    }

    function copyEl(srcId, btnId) {
      var text = document.getElementById(srcId).textContent.trim();
      var btn  = document.getElementById(btnId);
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      }).catch(function() {
        btn.textContent = 'Failed';
        setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
      });
    }

    run();
  </script>
</body>
</html>
